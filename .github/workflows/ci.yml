name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r skills\attendance-reporter\requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile skills\attendance-reporter\scripts\attendance.py
